[workspace]
resolver = "2"
members = [
    "crates/linamp-core",
    "crates/linamp-audio",
    "crates/linamp-skin",
    "apps/linamp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
authors = ["Sayooj K Karun <sayoojkkarun@gmail.com>"]

[workspace.dependencies]
linamp-core = { path = "crates/linamp-core" }
linamp-audio = { path = "crates/linamp-audio" }
linamp-skin = { path = "crates/linamp-skin" }
symphonia = { version = "0.5", features = ["all", "opt-simd"] }
libloading = "0.8"
rustfft = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["bmp", "png", "gif", "jpeg"] }
winit = { version = "0.30", default-features = false, features = ["x11", "rwh_06"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen"] }
fontdue = "0.9"
crossbeam-channel = "0.5"
parking_lot = "0.12"
fastrand = "2"
ureq = "2"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
