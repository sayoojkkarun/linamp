<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Linamp</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4358"/>
      <stop offset="1" stop-color="#161a23"/>
    </linearGradient>
    <linearGradient id="bars" gradientUnits="userSpaceOnUse" x1="0" y1="212" x2="0" y2="44">
      <stop offset="0" stop-color="#52e3a0"/>
      <stop offset="0.55" stop-color="#f2a93b"/>
      <stop offset="1" stop-color="#f0503c"/>
    </linearGradient>
  </defs>
  <!-- Tile, like the skin's panel. -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#tile)"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="50.5" fill="none" stroke="#5d6780" stroke-opacity="0.55" stroke-width="3"/>
  <!-- Display well. -->
  <rect x="34" y="34" width="188" height="188" rx="26" fill="#06090d"/>
  <!-- An "L" made of analyzer bars: tall stem, bouncing foot. -->
  <g fill="url(#bars)">
    <rect x="56" y="52" width="34" height="152" rx="7"/>
    <rect x="98" y="158" width="26" height="46" rx="6"/>
    <rect x="132" y="146" width="26" height="58" rx="6"/>
    <rect x="166" y="170" width="26" height="34" rx="6"/>
  </g>
  <!-- Peak dots. -->
  <g fill="#e6eaf2">
    <rect x="98" y="140" width="26" height="7" rx="3"/>
    <rect x="132" y="126" width="26" height="7" rx="3"/>
    <rect x="166" y="156" width="26" height="7" rx="3"/>
  </g>
</svg>
